name: Daily Build On Push

on:
  push:
    branches: ['**']

jobs:
  build:
    name: Build, package and upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build valac pkg-config dh-make devscripts fakeroot dpkg-dev \
            libgtk-3-dev libgranite-dev libglib2.0-dev libgee-0.8-dev libjson-glib-dev \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-libav libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libxml2-dev libgudev-1.0-dev libarchive-dev

      - name: Configure and build
        run: |
          meson setup build --prefix=/usr || meson configure build || true
          ninja -C build

      - name: Install into staging directory
        run: |
          rm -rf pkg
          mkdir -p pkg
          DESTDIR="$PWD/pkg" ninja -C build install

      - name: Create DEBIAN control and build .deb
        env:
          BRANCH: ${{ github.ref_name }}
          PKGNAME: io.elementary.music
          MAINTAINER: "${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>"
        run: |
          set -euo pipefail
          mkdir -p pkg/DEBIAN
          VERSION="$(date -u +%Y%m%d%H%M)-${BRANCH//[^a-zA-Z0-9_.-]/-}"
          printf '%s\n' \
            "Package: ${PKGNAME}" \
            "Version: ${VERSION}" \
            "Section: utils" \
            "Priority: optional" \
            "Architecture: amd64" \
            "Maintainer: ${MAINTAINER}" \
            "Description: Build of ${PKGNAME} from branch ${BRANCH}" \
            > pkg/DEBIAN/control
          chmod 0755 pkg/DEBIAN
          dpkg-deb --build pkg "${PKGNAME}_${VERSION}_amd64.deb"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-deb
          path: "./io.elementary.music_*.deb"
